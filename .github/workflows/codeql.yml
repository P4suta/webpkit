# Analyze affected Rust and GitHub Actions source.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # check out the source

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.99.1

jobs:
  plan:
    name: select analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install the repository Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: select affected analysis languages
        id: selection
        shell: bash
        env:
          CI_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_REVISION: ${{ github.sha }}
        run: |
          matrix=$(cargo run --locked --quiet -p webpkit-ci-select --bin ci-select -- codeql-matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to code scanning
      actions: read # inspect workflow metadata
      contents: read # check out the source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Broader security rule set than the default suite.
          queries: security-extended
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
