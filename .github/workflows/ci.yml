# Lean pull-request and merge-group gate for webpkit.
# Heavy release qualification runs from the exact candidate source in release-plz.yml.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_VERSION: 1.99.1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the repository Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2,taplo-cli@0.10.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0
          fallback: none
      - name: install pinned cargo-sort from the registry
        run: cargo install --locked --version 2.1.4 cargo-sort
      - name: install pinned yamlfmt
        env:
          YAMLFMT_VERSION: 0.21.0
        run: |
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp yamlfmt
          echo /tmp >> "$GITHUB_PATH"
      - name: install pinned Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          echo /tmp >> "$GITHUB_PATH"
      - name: install pinned typos
        env:
          TYPOS_VERSION: 1.51.1
        run: |
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp typos
          echo /tmp >> "$GITHUB_PATH"
      - name: run the ordinary quality gate
        run: npx --yes --package="@biomejs/biome@2.6.2" -- just check

  conventional-commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # The title action reads pull request metadata.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-required:
    name: ci-required
    if: always()
    needs:
      - quality
      - conventional-commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the repository Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: require every event-specific ordinary role to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo run --locked --quiet -p xtask -- ci required --event "$EVENT_NAME" --needs "$NEEDS_JSON"

  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the repository Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: require the strict aggregate to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo run --locked --quiet -p xtask -- ci required --final --needs "$NEEDS_JSON"
