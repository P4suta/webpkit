# Release automation via release-plz (https://release-plz.dev). On push to main:
#   - release-plz-pr:      opens/updates a release PR (version bump + CHANGELOG)
#                          from Conventional Commits.
#   - release-plz-release: when that PR merges, publishes newly-versioned crates to
#                          crates.io and creates the GitHub release + tag.
#                          cargo-semver-checks gates breaking API changes.
#
# Auth uses a GitHub App (no PAT, no repo-level secrets). Both jobs mint a short-
# lived installation token via actions/create-github-app-token, so release PRs are
# authored by the App and therefore DO trigger CI (GITHUB_TOKEN-authored PRs don't).
#
# Inject these into the `release` GitHub Environment (Settings > Environments):
#   - RELEASE_PLZ_APP_ID           the GitHub App's App ID
#   - RELEASE_PLZ_APP_PRIVATE_KEY  the App's private key (PEM)
# The App needs repository permissions: Contents: read/write, Pull requests:
# read/write, and must be installed on this repository.
#
# crates.io auth uses Trusted Publishing (OIDC), not a stored token: release-plz
# mints a short-lived token via `id-token: write`. Register a trusted publisher for
# each published crate on crates.io (owner P4suta, repo webpkit, workflow
# release-plz.yml, environment release).

name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Publish + GitHub release. Runs on every push to main but no-ops unless a release
  # PR merge introduced a new version (release_always = false); merging that PR is the
  # human gate. Don't add a required reviewer to `release`: this job runs on every
  # push, so approval would be demanded even for the no-op runs. crates.io pins its
  # trusted publisher to this environment name.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the git tag + GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: webpkit
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Open/update the release PR. Same App token so the PR triggers CI.
  release-plz-pr:
    name: release-plz pr
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: webpkit
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
